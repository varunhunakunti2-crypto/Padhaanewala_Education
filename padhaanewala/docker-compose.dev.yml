services:
  db:
    build:
      context: ./docker/db
    image: padhaanewala-db:dev
    environment:
      POSTGRES_DB: padhaanewala_dev
      POSTGRES_USER: padhaanewala
      POSTGRES_PASSWORD: dev_password_123
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata: