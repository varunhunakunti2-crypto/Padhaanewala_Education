[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
# `app.models.mock_test.TestAttempt` is a SQLAlchemy model, not a test class.
# Without this pytest tries to collect it and emits a PytestCollectionWarning
# on every run, which trains you to ignore warnings.
filterwarnings =
    ignore:cannot collect test class 'TestAttempt':pytest.PytestCollectionWarning
