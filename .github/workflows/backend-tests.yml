# Backend test suite.
#
# The 187 pytest tests run against a real PostgreSQL schema, not SQLite or an
# in-memory fake: tests/conftest.py migrates `$PADHAANEWALA_SCHEMA` and the
# catalog tests assert against seeded rows. So this workflow provisions a real
# Postgres service and bootstraps the schema with the same script developers
# run locally (backend/scripts/bootstrap_test_db.py).
name: backend-tests

on:
  push:
    # Only the long-lived branches. Pushing "**" here would run every pull
    # request twice - once for the branch push, once for the PR event.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: padhaanewala/backend

jobs:
  pytest:
    # Both dependencies are named because both are exercised: PostgreSQL by the
    # catalog tests, Redis by the live rate-limiter tests.
    name: pytest (postgresql ${{ matrix.postgres }} + redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 15 is the major version the dev database image is built from
        # (padhaanewala/docker/db). Bump deliberately, not by accident.
        postgres: ["15"]

    services:
      postgres:
        # Plain upstream image on purpose: docker/db is a security-hardened
        # rebuild that needs a Go toolchain to build, which is wasted minutes
        # in CI. Same major version, same SQL semantics.
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: padhaanewala_ci
          POSTGRES_USER: padhaanewala
          POSTGRES_PASSWORD: ci_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U padhaanewala -d padhaanewala_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The rate limiter is the only thing throttling /api/v1/auth, and it fails
      # *closed* there, so its behaviour is security-relevant. `conftest.py`
      # stubs Redis suite-wide to keep a developer's outcome independent of
      # whether a container is up -- which is right for the other 440 tests and
      # wrong for this one, because every limiter test would otherwise run
      # against a Python dict and the properties that need a real server
      # (atomicity under concurrency, a counter shared between processes, the
      # Lua script being accepted at all) would go unverified. The live tests
      # skip when no Redis answers, so without this service they would skip in
      # CI too and the gap would stay open invisibly.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg2://padhaanewala:ci_password_123@localhost:5432/padhaanewala_ci
      PADHAANEWALA_SCHEMA: test_suite
      # Database 15 is the scratch database `test_ratelimit_redis_live.py` uses
      # for its rate-limit keys, kept clear of the application's own database.
      REDIS_URL: redis://localhost:6379/15
      # R3.3/R3.4 are assertions about how a deployment is *configured*, so CI
      # has to supply a compliant configuration: two distinct signing secrets
      # and an access-token lifetime inside the 60-minute containment window
      # (logout is a no-op, so a token cannot be revoked). `.env.development`
      # is gitignored and, where it exists, sets both secrets to `change-me`.
      JWT_SECRET_KEY: ci-access-secret-not-a-real-key
      JWT_REFRESH_SECRET_KEY: ci-refresh-secret-not-a-real-key
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      APP_ENV: development

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 3.14 matches the interpreter in backend/venv, and is the only
          # version with prebuilt Linux wheels for every pinned native
          # dependency: cryptography==50.0.1 publishes cp314 manylinux wheels
          # but no cp312/cp313, so an older pin would silently fall back to a
          # Rust source build here.
          python-version: "3.14"
          cache: pip
          # Both files are installed below, so both belong in the cache key -
          # keying on requirements-dev.txt alone would serve a stale cache after
          # a runtime pin changes.
          cache-dependency-path: |
            padhaanewala/backend/requirements.txt
            padhaanewala/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Migrate and seed the test schema
        run: python scripts/bootstrap_test_db.py

      - name: Run the test suite
        run: pytest --junitxml=pytest-report.xml

      # A skipped live test is not a pass. These are the only tests that touch a
      # real Redis, so if the service did not come up the job would still be
      # green with the rate limiter's atomicity and cross-process behaviour
      # unverified — which is BUG-07 reopened behind a green tick. pytest exits
      # 0 on a full skip, so the skip count is asserted explicitly.
      - name: The live Redis tests ran rather than skipped
        run: pytest tests/test_ratelimit_redis_live.py -v -rs
      - name: Fail if the live Redis tests skipped
        if: always()
        run: |
          summary="$(pytest tests/test_ratelimit_redis_live.py -q -rs 2>&1 | tail -1)"
          echo "$summary"
          case "$summary" in
            *" skipped"*)
              echo "::error::The live Redis tests skipped, so the rate limiter's real behaviour is unverified. Check the redis service in this job."
              exit 1
              ;;
          esac

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-postgres-${{ matrix.postgres }}
          path: padhaanewala/backend/pytest-report.xml
          if-no-files-found: warn

  # --- 7.2 -------------------------------------------------------------
  # A separate job rather than a step at the end of `pytest`.
  #
  # It is independent of the database, so it runs in parallel and does not add
  # its ~40s to the test job's critical path, and an advisory is its own failure
  # with its own name in the checks list rather than a trailing step that a
  # timeout would skip.
  #
  # `requirements.txt` is a fully-pinned freeze including transitive
  # dependencies — which is why dependabot treats it as a single unit — so
  # `pip-audit` resolves to the exact tree the suite just tested. `--strict`
  # matters: without it pip-audit exits 0 on some failure paths, which is how an
  # audit gate quietly stops gating.
  python-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            padhaanewala/backend/requirements.txt
            padhaanewala/backend/requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip-audit
          pip-audit --strict --progress-spinner off \
            -r padhaanewala/backend/requirements.txt \
            -r padhaanewala/backend/requirements-dev.txt
